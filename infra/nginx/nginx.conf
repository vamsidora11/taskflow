# Single public origin: the SPA and the API share it, so the HttpOnly refresh cookie
# and Swagger UI "Authorize" work without CORS (PLAN.md 10A.3).
upstream backend {
  server backend:8000;
}

upstream frontend {
  server frontend:80;
}

server {
  listen 80;

  location ~ ^/(api|docs|redoc|health) {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
  }
}
