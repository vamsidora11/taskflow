name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: ci
      ENABLE_DOCS: "true"
      # CI makes the database and Redis test suites fail rather than skip when a server is missing.
      CI: "true"
      # Superuser URL: tests create their own roles and throwaway databases.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy app scripts tests
      - name: Verify OpenAPI spec is up to date
        run: |
          python -m scripts.export_openapi
          git diff --exit-code ../docs/openapi.json
      - name: Unit and integration tests
        run: pytest --ignore=tests/security --cov=app
      - name: Security suite (tenant isolation, RBAC, tokens, audit)
        # Run as its own step so a failure is unmistakable; appends to the same coverage data.
        run: pytest tests/security --cov=app --cov-append --cov-report=term-missing:skip-covered --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Validate compose files
        env:
          SMTP_HOST: smtp.example.com # required by the production file; empty in .env.example
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.prod.yml --env-file .env config -q
