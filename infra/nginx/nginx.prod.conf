# Production nginx: HTTPS only, one origin for the SPA and the API.
# Certificates are mounted at /etc/nginx/certs (fullchain.pem and privkey.pem).
# See docs/DEPLOYMENT.md for Let's Encrypt and managed-platform notes.

upstream backend {
  server backend:8000;
}

upstream frontend {
  server frontend:80;
}

# Plain HTTP only redirects (and answers the ACME challenge if you use certbot webroot).
server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;

  client_max_body_size 1m;

  # The API. X-Forwarded-For carries the real client address; the backend trusts it because the
  # backend port is not published (it is reachable only through this proxy).
  location ~ ^/(api|docs|redoc|health) {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # $remote_addr (not $proxy_add_x_forwarded_for): never forward a client-supplied chain, or a
    # caller could choose the address that rate limits and the audit log record.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location / {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
  }
}
